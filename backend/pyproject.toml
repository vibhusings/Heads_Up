[project]
name = "headsup"
version = "0.1.0"
description = "Heads Up: a voice co-pilot for your day, built on a self-healing multi-agent runtime"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "websockets>=13",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["headsup", "headsup.agents", "headsup.providers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
